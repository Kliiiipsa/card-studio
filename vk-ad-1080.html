<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Kartogen — VK баннер 1080×1080</title>
<style>
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:#0f172a; color:#e2e8f0;
         display:flex; flex-direction:column; align-items:center; gap:14px; padding:24px; }
  canvas { width:440px; height:440px; border-radius:16px; box-shadow:0 10px 40px rgba(0,0,0,.4); background:#111; }
  .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; align-items:flex-end; }
  button, select, input[type=text] { font:15px/1 -apple-system,Segoe UI,Roboto,sans-serif; padding:10px 16px; border-radius:10px; border:1px solid #334155; background:#1e293b; color:#e2e8f0; cursor:pointer; }
  button.primary { background:#6d5efc; border-color:#6d5efc; color:#fff; font-weight:600; }
  label { font-size:13px; color:#94a3b8; display:flex; flex-direction:column; gap:4px; }
  input[type=text] { min-width:300px; cursor:text; }
  .hint { font-size:12px; color:#64748b; max-width:520px; text-align:center; line-height:1.5; }
  .file { padding:10px 16px; border:1px dashed #475569; border-radius:10px; background:#1e293b; }
</style>
</head>
<body>
  <canvas id="c" width="1080" height="1080"></canvas>

  <div class="row">
    <label>Картинки карточек (1–4) — кидайте свои готовые карточки
      <input class="file" id="imgs" type="file" accept="image/*" multiple>
    </label>
  </div>
  <div class="row">
    <label>Заголовок<input type="text" id="title" value="Карточки для маркетплейсов"></label>
    <label>Плашка<input type="text" id="badge" value="Первое фото — бесплатно"></label>
  </div>
  <div class="row">
    <label>Стиль
      <select id="theme">
        <option value="violet">Фиолетово-синий</option>
        <option value="dark">Тёмный графит</option>
        <option value="light">Светлый</option>
      </select>
    </label>
    <button onclick="render()">Обновить</button>
    <button class="primary" onclick="download()">Скачать PNG 1080×1080</button>
  </div>
  <p class="hint">
    Загрузите 3–4 своих карточки (из раздела «Мои карточки») → получите баннер-коллаж с заголовком.
    Без картинок получится чистый текстовый баннер. Отредактируйте тексты → «Обновить» → «Скачать PNG» → загрузите в VK как изображение 1:1.
  </p>

<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");
const S = 1080;
let imgs = [];

const THEMES = {
  violet: { from:"#7c5cff", to:"#2563eb", text:"#ffffff", sub:"rgba(255,255,255,.9)", badgeBg:"#ffffff", badgeText:"#3b2fb0", cardsBg:"#eef1f8" },
  dark:   { from:"#1f2937", to:"#0b1220", text:"#ffffff", sub:"rgba(255,255,255,.82)", badgeBg:"#6d5efc", badgeText:"#ffffff", cardsBg:"#0b1220" },
  light:  { from:"#eef2ff", to:"#e0e7ff", text:"#1e1b4b", sub:"rgba(30,27,75,.72)", badgeBg:"#6d5efc", badgeText:"#ffffff", cardsBg:"#f5f7ff" },
};

function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function wrap(text, font, maxW){
  ctx.font = font;
  const words = text.split(" ");
  const lines = []; let cur = "";
  for(const w of words){ const t = cur ? cur+" "+w : w;
    if(ctx.measureText(t).width > maxW && cur){ lines.push(cur); cur = w; } else cur = t; }
  if(cur) lines.push(cur);
  return lines;
}

/** cover-fit картинки в прямоугольник с обрезкой */
function drawCover(img, x, y, w, h, r){
  ctx.save();
  roundRect(x,y,w,h,r); ctx.clip();
  const s = Math.max(w/img.width, h/img.height);
  const dw = img.width*s, dh = img.height*s;
  ctx.drawImage(img, x+(w-dw)/2, y+(h-dh)/2, dw, dh);
  ctx.restore();
}

function drawHeaderBand(th, hbH){
  const g = ctx.createLinearGradient(0,0,S,hbH);
  g.addColorStop(0, th.from); g.addColorStop(1, th.to);
  ctx.fillStyle = g; ctx.fillRect(0,0,S,hbH);
  const rg = ctx.createRadialGradient(S*0.3,0,0,S*0.3,0,S*0.7);
  rg.addColorStop(0,"rgba(255,255,255,.16)"); rg.addColorStop(1,"rgba(255,255,255,0)");
  ctx.fillStyle = rg; ctx.fillRect(0,0,S,hbH);

  const pad = 70;
  // бренд
  ctx.fillStyle = th.badgeBg; roundRect(pad, 54, 56, 56, 15); ctx.fill();
  ctx.fillStyle = th.badgeText; ctx.font="700 34px -apple-system,Segoe UI,Roboto,sans-serif";
  ctx.textBaseline="middle"; ctx.textAlign="center"; ctx.fillText("K", pad+28, 84);
  ctx.textAlign="left"; ctx.fillStyle=th.text; ctx.font="700 34px -apple-system,Segoe UI,Roboto,sans-serif";
  ctx.fillText("Kartogen", pad+72, 84);
  ctx.textBaseline="alphabetic";

  // заголовок
  const title = document.getElementById("title").value.trim();
  const tf = "800 72px -apple-system,Segoe UI,Roboto,sans-serif";
  const lines = wrap(title, tf, S - pad*2);
  ctx.font = tf; ctx.fillStyle = th.text;
  let y = 190;
  for(const ln of lines){ ctx.fillText(ln, pad, y); y += 82; }
}

function drawBadge(th, y){
  const badge = document.getElementById("badge").value.trim();
  if(!badge) return;
  const pad = 70;
  ctx.font="700 36px -apple-system,Segoe UI,Roboto,sans-serif";
  const tw = ctx.measureText(badge).width, bw = tw+64, bh = 76;
  ctx.fillStyle = th.badgeBg; roundRect(pad, y, bw, bh, 38); ctx.fill();
  ctx.fillStyle = th.badgeText; ctx.textBaseline="middle";
  ctx.fillText(badge, pad+32, y+bh/2+2);
  ctx.textBaseline="alphabetic";
}

function render(){
  const th = THEMES[document.getElementById("theme").value];

  if(imgs.length === 0){
    // ── текстовый баннер ──
    const g = ctx.createLinearGradient(0,0,S,S);
    g.addColorStop(0, th.from); g.addColorStop(1, th.to);
    ctx.fillStyle=g; ctx.fillRect(0,0,S,S);
    drawHeaderBand(th, S); // на весь холст
    // подпись
    ctx.font="500 42px -apple-system,Segoe UI,Roboto,sans-serif"; ctx.fillStyle=th.sub;
    wrap("Фото, инфографика и видео товара за минуты", ctx.font, S-140).forEach((ln,i)=>ctx.fillText(ln,70,470+i*56));
    drawBadge(th, S-70-76);
    ctx.font="600 32px -apple-system,Segoe UI,Roboto,sans-serif"; ctx.fillStyle=th.sub;
    ctx.textAlign="right"; ctx.fillText("kartogen.ru", S-70, S-92); ctx.textAlign="left";
    return;
  }

  // ── коллаж ──
  const hbH = 270;
  ctx.fillStyle = th.cardsBg; ctx.fillRect(0,0,S,S);
  drawHeaderBand(th, hbH);

  const n = Math.min(imgs.length, 4);
  const gap = 18, sidePad = 30;
  const areaW = S - sidePad*2;
  let cellW = (areaW - gap*(n-1)) / n;
  let cellH = cellW * 4/3;                 // ячейка в пропорции карточки 3:4 → карточка видна целиком
  const cardsTop = hbH + 24;
  const maxH = S - cardsTop - 120;         // снизу оставляем место под плашку
  if (cellH > maxH) { cellH = maxH; cellW = cellH * 3/4; }
  const rowW = cellW*n + gap*(n-1);
  const startX = (S - rowW) / 2;
  for(let i=0;i<n;i++){
    const x = startX + i*(cellW+gap);
    ctx.save(); ctx.shadowColor="rgba(0,0,0,.20)"; ctx.shadowBlur=24; ctx.shadowOffsetY=8;
    ctx.fillStyle="#ffffff"; roundRect(x, cardsTop, cellW, cellH, 16); ctx.fill(); ctx.restore();
    drawCover(imgs[i], x, cardsTop, cellW, cellH, 16);
  }
  // адрес — в шапке справа
  ctx.font="600 30px -apple-system,Segoe UI,Roboto,sans-serif"; ctx.fillStyle=th.text;
  ctx.textAlign="right"; ctx.fillText("kartogen.ru", S-70, hbH-34); ctx.textAlign="left";
  // плашка — по центру снизу
  const badge = document.getElementById("badge").value.trim();
  if(badge){
    ctx.font="700 38px -apple-system,Segoe UI,Roboto,sans-serif";
    const tw = ctx.measureText(badge).width, bw = tw+64, bh = 80;
    const bx = (S-bw)/2, by = S - 36 - bh;
    ctx.save(); ctx.shadowColor="rgba(0,0,0,.22)"; ctx.shadowBlur=20; ctx.shadowOffsetY=6;
    ctx.fillStyle = th.badgeBg; roundRect(bx, by, bw, bh, 40); ctx.fill(); ctx.restore();
    ctx.fillStyle = th.badgeText; ctx.textBaseline="middle"; ctx.textAlign="center";
    ctx.fillText(badge, S/2, by+bh/2+2);
    ctx.textAlign="left"; ctx.textBaseline="alphabetic";
  }
}

document.getElementById("imgs").addEventListener("change", (e)=>{
  const files = [...e.target.files].slice(0,4);
  let loaded = [];
  let pending = files.length;
  if(!pending){ imgs=[]; render(); return; }
  files.forEach((f, idx)=>{
    const r = new FileReader();
    r.onload = () => { const im = new Image(); im.onload = ()=>{ loaded[idx]=im; if(--pending===0){ imgs = loaded.filter(Boolean); render(); } }; im.src = r.result; };
    r.readAsDataURL(f);
  });
});

function download(){
  c.toBlob(function(b){
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b); a.download = "kartogen-vk-1080.png"; a.click();
    URL.revokeObjectURL(a.href);
  }, "image/png");
}

render();
</script>
</body>
</html>
